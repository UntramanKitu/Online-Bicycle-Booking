{% if page_obj.paginator.num_pages > 1 %}
<div class="bs-pager">
    <span>Showing {{ page_obj.start_index }} to {{ page_obj.end_index }} of {{ page_obj.paginator.count }}</span>
    <div style="display:flex;gap:8px">
        {% if page_obj.has_previous %}
        <a class="bs-btn bs-btn-ghost bs-btn-sm" href="?{% if page_qs %}{{ page_qs }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>
        {% else %}
        <span class="bs-btn bs-btn-ghost bs-btn-sm" aria-disabled="true" style="opacity:.5;cursor:default">Previous</span>
        {% endif %}
        {% if page_obj.has_next %}
        <a class="bs-btn bs-btn-ghost bs-btn-sm" href="?{% if page_qs %}{{ page_qs }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>
        {% else %}
        <span class="bs-btn bs-btn-ghost bs-btn-sm" aria-disabled="true" style="opacity:.5;cursor:default">Next</span>
        {% endif %}
    </div>
</div>
{% endif %}
