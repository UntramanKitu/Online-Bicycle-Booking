{% if page_obj.paginator.num_pages > 1 %}
<div class="bk-pager">
    <span>Showing {{ page_obj.start_index }} to {{ page_obj.end_index }} of {{ page_obj.paginator.count }}</span>
    <div>
        {% if page_obj.has_previous %}
        <a class="bk-btn bk-btn--sm" href="?{% if page_qs %}{{ page_qs }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>
        {% else %}
        <span class="bk-btn bk-btn--sm" aria-disabled="true">Previous</span>
        {% endif %}
        {% if page_obj.has_next %}
        <a class="bk-btn bk-btn--sm" href="?{% if page_qs %}{{ page_qs }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>
        {% else %}
        <span class="bk-btn bk-btn--sm" aria-disabled="true">Next</span>
        {% endif %}
    </div>
</div>
{% endif %}
