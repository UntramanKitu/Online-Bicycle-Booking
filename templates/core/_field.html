<div class="bk-field{% if wide %} bk-field--wide{% endif %}{% if field.errors %} has-error{% endif %}">
    <label class="bk-label" for="{{ field.id_for_label }}">
        <span>{{ field.label }}</span>
        {% if not field.field.required %}<span class="bk-opt">optional</span>{% endif %}
    </label>
    {{ field }}
    {% for error in field.errors %}<p class="bk-error">{{ error }}</p>{% endfor %}
</div>
