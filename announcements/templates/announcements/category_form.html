{% extends 'base.html' %}
{% block content %}
<div class="bs-section" style="max-width:620px;margin:0 auto">
    <div class="bs-section-head">
        <h1 class="bs-section-title">{{ title }}</h1>
        <a href="{% url 'announcements:category_list' %}" class="bs-btn bs-btn-ghost">ยกเลิก</a>
    </div>

    <div class="bs-panel">
        <form method="POST">
            {% csrf_token %}

            <div class="bs-form-grid">
                {% for field in form %}
                <div class="bs-field bs-field-wide">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<p class="bs-field-error">{{ error }}</p>{% endfor %}
                </div>
                {% endfor %}
            </div>

            <div class="bs-form-actions" style="border-top:1px solid var(--bs-border);margin-top:18px;padding-top:16px">
                <button type="submit" class="bs-btn bs-btn-primary">บันทึกหมวดหมู่</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
