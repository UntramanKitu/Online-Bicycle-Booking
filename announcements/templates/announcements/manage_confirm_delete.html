{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="bg-white rounded-lg shadow p-6 text-center">
        <svg class="mx-auto h-12 w-12 text-red-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">ลบประกาศข่าวสาร</h2>
        <p class="text-gray-500 mb-6">คุณแน่ใจหรือไม่ว่าต้องการลบ "{{ announcement.title }}"? การกระทำนี้จะซ่อนประกาศจากผู้ใช้งาน</p>
        
        <form method="POST" class="flex justify-center gap-4">
            {% csrf_token %}
            <a href="{% url 'announcements:manage_list' %}" class="bg-gray-200 text-gray-800 px-6 py-2 rounded-md hover:bg-gray-300 transition">ยกเลิก</a>
            <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-md hover:bg-red-700 transition">ยืนยันการลบ</button>
        </form>
    </div>
</div>
{% endblock %}
