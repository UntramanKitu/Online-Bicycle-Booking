{% extends 'base.html' %}
{% block content %}
<div class="bs-panel" style="max-width:560px;margin:40px auto;text-align:center">
    <div style="font-size:44px;margin-bottom:10px">🗑️</div>
    <h2 style="font-size:22px;color:var(--bs-dark);margin:0 0 8px">ลบประกาศข่าวสาร</h2>
    <p class="bs-muted" style="margin-bottom:20px">คุณแน่ใจหรือไม่ว่าต้องการลบ "{{ announcement.title }}"? การกระทำนี้จะซ่อนประกาศจากผู้ใช้งาน</p>

    <form method="POST" style="display:flex;justify-content:center;gap:10px">
        {% csrf_token %}
        <a href="{% url 'announcements:manage_list' %}" class="bs-btn bs-btn-ghost">ยกเลิก</a>
        <button type="submit" class="bs-btn bs-btn-danger">ยืนยันการลบ</button>
    </form>
</div>
{% endblock %}
