{% extends 'base.html' %}
{% block content %}
<div class="bs-section">
    <div class="bs-section-head">
        <h1 class="bs-section-title">จัดการหมวดหมู่</h1>
        <div class="bs-head-actions">
            <a href="{% url 'announcements:manage_list' %}" class="bs-btn bs-btn-ghost">กลับไปหน้าประกาศ</a>
            <a href="{% url 'announcements:category_create' %}" class="bs-btn bs-btn-primary">สร้างหมวดหมู่ใหม่</a>
        </div>
    </div>

    <div class="bs-panel bs-table-wrap">
        <table class="bs-table">
            <thead>
                <tr>
                    <th>ชื่อ</th>
                    <th>สถานะ</th>
                </tr>
            </thead>
            <tbody>
                {% for category in categories %}
                <tr>
                    <td>{{ category.name }}</td>
                    <td>
                        {% if category.is_active %}
                        <span class="bs-badge bs-badge-available">ใช้งาน</span>
                        {% else %}
                        <span class="bs-badge bs-badge-inactive">ปิดใช้งาน</span>
                        {% endif %}
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="2" class="bs-empty">ยังไม่มีหมวดหมู่</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
