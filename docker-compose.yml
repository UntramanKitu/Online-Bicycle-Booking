services:
  db:
    image: postgres:16
    container_name: bikea_db
    environment:
      POSTGRES_USER: bikea
      POSTGRES_PASSWORD: bikea
      POSTGRES_DB: bikea
    ports:
      - "5434:5432"
    volumes:
      - bikea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikea -d bikea"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bike_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: bike_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  bikea_pgdata: