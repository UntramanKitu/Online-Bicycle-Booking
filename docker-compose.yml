# docker-compose นี้ใช้แค่ยกฐานข้อมูล PostgreSQL เท่านั้น
# backend / frontend ต้องรันบนเครื่องตรง ๆ (ดูคำสั่งใน README.md)
services:
  db:
    image: postgres:16
    container_name: bikea_db
    environment:
      POSTGRES_USER: bikea
      POSTGRES_PASSWORD: bikea
      POSTGRES_DB: bikea
    ports:
      - "5434:5432"
    volumes:
      - bikea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikea -d bikea"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bikea_pgdata:
